apiVersion: apps/v1
kind: Deployment
metadata:
  name: public-api
  namespace: api
spec:
  replicas: 12
  selector:
    matchLabels:
      app: public-api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: public-api
    spec:
      containers:
        - name: api
          image: registry.internal/api/public-api:2026.11.3
          ports:
            - containerPort: 8080
          env:
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: public-api-secrets
                  key: redis-url
            - name: WEB_CONCURRENCY
              value: "8"
          resources:
            requests:
              cpu: "1"
              memory: 1Gi
            limits:
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: public-api
  namespace: api
spec:
  type: ClusterIP
  sessionAffinity: None
  selector:
    app: public-api
  ports:
    - port: 80
      targetPort: 8080
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: public-api
  namespace: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: public-api
  minReplicas: 12
  maxReplicas: 40
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
