apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
spec:
  replicas: 6
  selector:
    matchLabels: { app: catalog-service }
  template:
    metadata:
      labels: { app: catalog-service }
    spec:
      containers:
        - name: catalog
          image: registry.internal/catalog-service:stable
          ports:
            - containerPort: 8080
          env:
            - name: DB_POOL_MAX
              value: "10"
            - name: DB_ACQUIRE_TIMEOUT_MS
              value: "2000"
            - name: REDIS_URL
              valueFrom:
                secretKeyRef: { name: catalog-redis, key: url }
          resources:
            requests: { cpu: "500m", memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
