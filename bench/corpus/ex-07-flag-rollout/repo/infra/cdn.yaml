distribution: app-edge
hostnames:
  - app.pixelnest.example

origins:
  app:
    domain: app-origin.internal.pixelnest.example
    protocol: https
  static:
    domain: pn-web-assets.objects.example
    protocol: https

behaviors:
  - path: /static/*
    origin: static
    methods: [GET, HEAD]
    cache:
      ttl_seconds: 31536000
      ignore_origin_cache_control: false

  - path: /flags/rules.json
    origin: app
    methods: [GET, HEAD]
    cache:
      ttl_seconds: 300
      ignore_origin_cache_control: true
      serve_stale_on_error_seconds: 3600
    compress: true

  - path: /*
    origin: app
    methods: [GET, HEAD, POST, PUT, PATCH, DELETE, OPTIONS]
    cache:
      ttl_seconds: 0
