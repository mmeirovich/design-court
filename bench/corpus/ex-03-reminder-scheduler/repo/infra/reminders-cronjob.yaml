apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-reminders
  namespace: jobs
spec:
  schedule: "*/5 * * * *"
  timeZone: "Etc/UTC"
  concurrencyPolicy: Allow
  startingDeadlineSeconds: 120
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reminders
              image: registry.internal/jobs/reminders:2026.11.2
              command: ["python", "-m", "jobs.daily_reminders"]
              env:
                - name: SEND_WORKERS
                  value: "4"
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: jobs-secrets
                      key: database-url
              resources:
                requests:
                  cpu: 500m
                  memory: 512Mi
                limits:
                  memory: 1Gi
